<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Replace relative timestamps on GitHub with exact dates and times in Firefox and Chrome.">
  <title>GitHub Absolute Dates</title>
  <link rel="icon" type="image/png" sizes="128x128" href="icon-128.png">
  <link rel="stylesheet" href="styles.css">

  <script>
    function getRelativeDate() {
      const date = new Date();
      date.setDate(date.getDate() - 3);
      return date;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const date = getRelativeDate();
      const time = document.getElementById("example-date");

      time.dateTime = date.toISOString();
      time.textContent = date.toLocaleString();
    });
  </script>

</head>
<body class="landing">
  <header class="shell">
    <span class="brand"><img src="icon-128.png" width="28" height="28" alt="">GitHub Absolute Dates</span>
    <a href="https://github.com/helblinglilly/gh-absolute-dates">View source</a>
  </header>
  <main class="shell">
    <section class="hero">
      <div>
        <h1>Sensible timestamps.</h1>
        <p class="intro">Read accurate timestamps when it matters most, not a vague indicator.</p>
        <div class="actions">
          <a href="https://chrome.google.com/webstore/detail/emgehigipehjohffhkjchncdplggnimo">
            <img
              src="https://developer.chrome.com/static/docs/webstore/branding/image/UV4C4ybeBTsZt43U4xis.png"
              width="206"
              height="58"
              style="display: block;"
              alt="Install via Chrome web store"
            />
          </a>
          <a class="button" href="/downloads/gh-absolute-dates-1.0.2.xpi">Install for Firefox</a>
        </div>
      </div>
      <div style="display: grid; gap: 1rem;">
        <figure>
          <figcaption>❌ chore: build date modification into Web UI</figcaption>
          <dl>
            <div><dt>GitHub's default behaviour</dt><dd>3 days ago</dd></div>
          </dl>
        </figure>
        <figure>
          <figcaption>✅ feat: customise date via browser extension</figcaption>
          <dl>
            <div><dt>With this extension</dt><dd><time id="example-date"></time></dd></div>
          </dl>
        </figure>
      </div>
    </section>
  </main>
  <footer class="shell">
    <a href="/privacy">Privacy policy</a>
  </footer>
</body>
</html>
