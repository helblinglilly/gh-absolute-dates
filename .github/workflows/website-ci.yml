name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check landing page files
        run: |
          test -s website/public/index.html
          test -s website/public/styles.css
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/public/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gh.helbling.uk
    concurrency:
      group: website-production
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: website
          wranglerVersion: '4.158.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
