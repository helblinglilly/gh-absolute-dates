name: Release

# Push a tag like v1.2.0 to publish a release with Chrome and Firefox packages.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional: set these repository secrets to get a signed Firefox .xpi.
      # Create keys at https://addons.mozilla.org/developers/addon/api/key/
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Package for Chrome and Firefox
        run: scripts/package.sh "${GITHUB_REF_NAME}"

      - name: Sign for Firefox (self-distributed .xpi)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx web-ext sign \
            --source-dir stage \
            --artifacts-dir artifacts \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
